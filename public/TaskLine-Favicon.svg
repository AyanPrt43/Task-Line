<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="70" y1="50" x2="450" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07120F"/>
      <stop offset="1" stop-color="#020708"/>
    </linearGradient>
    <linearGradient id="teal" x1="170" y1="360" x2="390" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08AFC5"/>
      <stop offset=".55" stop-color="#21E6C1"/>
      <stop offset="1" stop-color="#8AF7B4"/>
    </linearGradient>
    <linearGradient id="border" x1="80" y1="80" x2="430" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1FF2C4"/>
      <stop offset="1" stop-color="#08B9E7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- App-icon background -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg)"/>
  <rect x="30" y="30" width="452" height="452" rx="102"
        fill="none" stroke="url(#border)" stroke-width="7" filter="url(#glow)"/>

  <!-- Folded T -->
  <path d="M106 116
           C106 91 126 72 151 72
           H325
           C349 72 366 83 377 101
           L399 137
           C406 149 398 166 384 166
           H285
           V357
           C285 391 264 414 232 414
           H221
           C188 414 168 391 168 357
           V166
           H127
           C115 166 106 156 106 144Z"
        fill="#F8FAFC"/>

  <!-- Teal folded top -->
  <path d="M325 72
           C349 72 366 83 377 101
           L399 137
           C406 149 398 166 384 166
           H285
           L325 72Z"
        fill="url(#teal)"/>

  <!-- Checkmark ribbon -->
  <path d="M238 322
           L278 362
           L381 257
           C394 244 414 244 427 257
           C440 270 440 290 427 303
           L299 431
           C287 443 268 443 256 431
           L196 371
           C183 358 183 338 196 325
           C208 312 225 310 238 322Z"
        fill="url(#teal)"/>

  <!-- Lower folded accent -->
  <path d="M299 431 L382 348 V398 C382 418 365 431 345 431Z"
        fill="#20E8BF"/>

  <!-- Spark accents -->
  <g fill="url(#teal)">
    <rect x="388" y="83" width="18" height="54" rx="9" transform="rotate(20 388 83)"/>
    <rect x="430" y="125" width="18" height="54" rx="9" transform="rotate(58 430 125)"/>
  </g>
</svg>